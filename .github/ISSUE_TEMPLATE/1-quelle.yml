name: Quelle melden (öffentliches Video, Livestream, Bericht)
description: Ein schon öffentlich gepostetes Video, einen Stream oder Bericht zur Demo am 31.10.2026 vorschlagen.
title: "Quelle: "
labels: ["quelle"]
body:
  - type: markdown
    attributes:
      value: |
        Issues sind **öffentlich**, mit deinem GitHub-Konto verknüpft und werden auch außerhalb von GitHub kopiert und archiviert. Wer mitliest, sieht also, dass du dich mit der Demo befasst. Willst du das nicht, nutze die [Einreichseite](https://protest-watch.org/einreichen/), dort geht es auch anonym. Bitte nur Links zu schon öffentlich gepostetem Material. Lade keine Fotos oder Videos hoch und nenne keine Namen, Kennzeichen oder Dienstnummern. Beiträge mit Angaben zu anderen Personen lösche ich. Entfernen lassen: protest-watch@pm.me.
  - type: input
    id: link
    attributes:
      label: Link
      placeholder: https://…
    validations:
      required: true
  - type: input
    id: zeit
    attributes:
      label: Uhrzeit am 31.10. (ungefähr reicht)
      placeholder: z. B. 16:40–16:50
  - type: input
    id: ort
    attributes:
      label: Ort und Blickrichtung
      placeholder: z. B. Konrad-Adenauer-Ufer beim Weckschnapp, Blick nach Norden
  - type: textarea
    id: inhalt
    attributes:
      label: Was ist zu sehen?
      description: Kurz das Geschehen beschreiben, nicht einzelne Personen.
  - type: checkboxes
    id: hinweise
    attributes:
      label: Bestätigung
      options:
        - label: Der Link ist schon öffentlich, und ich habe keine Namen oder Personenbeschreibungen eingetragen.
          required: true
