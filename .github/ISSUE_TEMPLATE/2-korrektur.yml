name: Korrektur oder Ergänzung zur Karte
description: Etwas auf der Karte ist falsch, ungenau oder fehlt (Ereignis, Ort, Uhrzeit, Menge, Fahrzeuge).
title: "Korrektur: "
labels: ["korrektur"]
body:
  - type: markdown
    attributes:
      value: |
        Issues sind **öffentlich**, mit deinem GitHub-Konto verknüpft und werden auch außerhalb von GitHub kopiert und archiviert. Wer mitliest, sieht also, dass du dich mit der Demo befasst. Willst du das nicht, nutze die [Einreichseite](https://protest-watch.org/einreichen/), dort geht es auch anonym. Bitte nur Links zu schon öffentlich gepostetem Material. Lade keine Fotos oder Videos hoch und nenne keine Namen, Kennzeichen oder Dienstnummern. Beiträge mit Angaben zu anderen Personen lösche ich. Entfernen lassen: protest-watch@pm.me.
  - type: input
    id: moment
    attributes:
      label: Link zum Moment
      description: In der Karte „🔗 Link zu diesem Moment“ klicken und hier einfügen.
      placeholder: https://protest-watch.org/karte/#t=…
  - type: textarea
    id: was
    attributes:
      label: Was stimmt nicht oder fehlt?
    validations:
      required: true
  - type: textarea
    id: beleg
    attributes:
      label: Woher weißt du das? (Link, Bericht, eigene Beobachtung)
